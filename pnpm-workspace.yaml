packages:
  - '.'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - sharp

# next-pwa 10.2.9 pins Workbox 7.1.x; keep its build and runtime family aligned.
# Workbox 7.4.1 uses the patched Rollup terser/serialize-javascript dependency chain.
overrides:
  "@ducanh2912/next-pwa>workbox-build": 7.4.1
  "@ducanh2912/next-pwa>workbox-core": 7.4.1
  "@ducanh2912/next-pwa>workbox-webpack-plugin": 7.4.1
  "@ducanh2912/next-pwa>workbox-window": 7.4.1
  # Limit security fixes to the verified Vercel CLI dependency owners.
  "@vercel/fun>tar": 7.5.21
  "@mapbox/node-pre-gyp>tar": 7.5.21
  "@vercel/python-analysis>minimatch": 10.2.5
  # Remaining advisory fixes are scoped to their owners and existing major lines.
  "@vercel/node>undici": 5.29.0
  "@vercel/blob>undici": 6.28.1
  "@vercel/sandbox>undici": 7.29.1
  "@vercel/node>path-to-regexp": 6.3.0
  "@vercel/remix-builder>path-to-regexp": 6.3.0

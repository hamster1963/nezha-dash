packages:
  - '.'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - sharp

# next-pwa 10.2.9 pins Workbox 7.1.x; keep its build and runtime family aligned.
# Workbox 7.4.1 uses the patched Rollup terser/serialize-javascript dependency chain.
overrides:
  "@ducanh2912/next-pwa>workbox-build": 7.4.1
  "@ducanh2912/next-pwa>workbox-core": 7.4.1
  "@ducanh2912/next-pwa>workbox-webpack-plugin": 7.4.1
  "@ducanh2912/next-pwa>workbox-window": 7.4.1
  # Workbox uses glob's synchronous API; glob 14 fixes cancellation and uses patched minimatch.
  "workbox-build>glob": 14.0.3
  "@rollup/plugin-terser>serialize-javascript": 7.1.4
  # Keep remaining transitive security fixes within compatible release lines.
  "minimatch@5>brace-expansion": 2.1.7
  "ajv>fast-uri": 3.1.9
  "source-map-js": 1.2.2
  "@babel/helper-compilation-targets>browserslist": 4.28.7
  "webpack>browserslist": 4.28.7
  "next>baseline-browser-mapping": 2.11.0
  "browserslist>baseline-browser-mapping": 2.11.0
  "core-js-compat>browserslist": 4.28.7

patchedDependencies:
  # GHSA-gcqx-w48m-w2h4: no upstream release yet. Filter __proto__ from both
  # source and target keys; keep the regression tests until upstream is fixed.
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch

name: Container and PWA validation

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ""
  pull_request:
  push:
    branches: ["main"]

jobs:
  container:
    name: Docker ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify release policy
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          node --test scripts/*.test.cjs
          if [ -n "$RELEASE_TAG" ]; then node scripts/release-policy.cjs check "$RELEASE_TAG"; fi
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: hamster1963/nezha-dash
          tags: type=sha
          labels: |
            org.opencontainers.image.version=${{ inputs.release-tag || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - name: Build native image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: nezha-validation:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_TAG=${{ inputs.release-tag }}
            COMMIT_SHA=${{ github.sha }}
          # A Docker archive contains the image tested below. No later rebuild.
          provenance: false
      - name: Start isolated container and fixture backend
        run: |
          docker run -d --name nezha-validation -p 127.0.0.1:3041:3000 \
            -e HOSTNAME=0.0.0.0 -e SitePassword=local-validation-only \
            -e AUTH_SECRET=local-validation-secret-not-production \
            -e NezhaBaseUrl=http://127.0.0.1:3042 -e NezhaAuth=local-fixture \
            -e NEXT_TELEMETRY_DISABLED=1 nezha-validation
          docker exec -d nezha-validation node -e 'require("node:http").createServer((req,res)=>{res.setHeader("Content-Type","application/json");res.end(JSON.stringify({code:0,result:[]}))}).listen(3042,"127.0.0.1")'
          docker exec nezha-validation node -e 'if(!process.version.startsWith("v24."))process.exit(1);console.log(process.version,process.arch)'
      - name: Verify standalone container and authentication
        run: node scripts/verify-container.cjs
      - name: Install browser test tooling
        if: matrix.arch == 'amd64'
        run: |
          npm install --prefix "$RUNNER_TEMP/pwa-browser" --no-audit --no-fund agent-browser@0.38.2
          "$RUNNER_TEMP/pwa-browser/node_modules/.bin/agent-browser" install --with-deps
      - name: Verify service worker and offline reload in Chromium
        if: matrix.arch == 'amd64'
        env:
          AGENT_BROWSER_BIN: ${{ runner.temp }}/pwa-browser/node_modules/.bin/agent-browser
        run: node scripts/verify-pwa.cjs
      - name: Save tested image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/tested-image"
          docker image inspect nezha-validation --format '{{.Id}}' > "$RUNNER_TEMP/tested-image/$ARCH.id"
          docker save nezha-validation | gzip > "$RUNNER_TEMP/tested-image/$ARCH.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/tested-image/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs nezha-validation || true
          docker rm -f nezha-validation || true

  archive-check:
    name: Verify tested image transport
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-image-*
          merge-multiple: true
          path: tested-images
      - name: Reload and verify both tested image archives without publishing
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          for arch in amd64 arm64; do
            docker load -i "tested-images/$arch.tar.gz"
            id=$(cat "tested-images/$arch.id")
            test "$(docker image inspect nezha-validation --format '{{.Id}}')" = "$id"
            test "$(docker image inspect "$id" --format '{{.Architecture}}')" = "$arch"
            test "$(docker image inspect "$id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$COMMIT_SHA"
          done

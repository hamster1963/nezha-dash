name: Validate and publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/container-validation.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    permissions:
      contents: write
    # Serialize all versions through the latest check and publication.
    concurrency:
      group: release-publication
      cancel-in-progress: false
    env:
      REGISTRY_IMAGE: hamster1963/nezha-dash
      ALIYUN_REGISTRY_IMAGE: registry.cn-guangzhou.aliyuncs.com/hamster-home/nezha-dash
      RELEASE_TAG: ${{ github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: tested-image-*
          merge-multiple: true
          path: tested-images
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-guangzhou.aliyuncs.com
          username: ${{ secrets.ALI_USERNAME }}
          password: ${{ secrets.ALI_TOKEN }}
      - name: Publish tested images and release
        run: bash scripts/publish-release.sh tested-images
